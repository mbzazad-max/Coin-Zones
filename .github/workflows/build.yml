name: Build and deploy Coin Zones
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this run (the Refresh button fills this in)'
        required: false
        default: 'manual'
      force:
        description: 'Rebuild even if no new candles arrived'
        type: boolean
        default: false
  schedule:
    - cron: '17 23 * * *'   # once a day as a safety net (10:17 Sydney summer time); data commits trigger it too
  push:
    branches: [main]
    paths: ['public/**', 'worker/**', 'build/**', 'config/**', 'placeholder/**', 'wrangler.jsonc', 'reference/**']
permissions:
  contents: write
concurrency:
  group: coin-zones
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Engine files must be byte-identical to the original artifact
        run: cd public && sha256sum -c --quiet ../reference/ENGINE_SHA256SUMS
      - name: Check secrets
        env:
          MD: ${{ secrets.MARKET_DATA_TOKEN }}
        run: '[ -n "$MD" ] || { echo "::error::Secret MARKET_DATA_TOKEN is not set, so the shared data cannot be read. Nothing changed."; exit 1; }'
      - uses: actions/checkout@v4
        with:
          repository: mbzazad-max/market-data
          token: ${{ secrets.MARKET_DATA_TOKEN }}
          path: md
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the board from closed candles (keeps last good rows on any failure)
        run: node build/build.js md ${{ inputs.force && '--force' || '' }}
      - name: Save the new board (one commit)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data.json public/pnl.json public/freshness.json state
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -q -m "Board build $(node -p "require('./public/freshness.json').generated")"
          for i in 1 2 3 4 5; do git push -q origin HEAD:main && exit 0; git pull -q --rebase origin main; sleep $((i*2)); done
          echo "::error::Could not save the board."; exit 1
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REFRESH_TOKEN: ${{ secrets.MARKET_DATA_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::warning::Cloudflare secrets not set; built but not deployed."; exit 0; fi
          if [ "$(node -p "require('./config/deploy.json').access_confirmed")" = "true" ]; then
            npx -y wrangler@4 deploy
          else
            echo "Access lock not confirmed yet: deploying the placeholder page only."
            npx -y wrangler@4 deploy --assets ./placeholder
          fi
          printf '%s' "$REFRESH_TOKEN" | npx -y wrangler@4 secret put GITHUB_TOKEN
